name: ping
description: "Ping – ein schneller, moderner Messenger."
publish_to: 'none'
version: 0.22.0+27

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2
  # Media + accessibility
  file_picker: ^11.0.0
  record: ^7.0.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  # In-app auto-update: read the running version + open the downloaded APK.
  package_info_plus: ^8.1.1
  open_filex: ^4.5.0
  crypto: ^3.0.6 # verify the downloaded APK's sha256 before installing
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_messaging: ^16.0.5
  video_player: ^2.11.1
  flutter_webrtc: ^1.5.0
  # Desktop device-linking (WhatsApp-Web-style): render the QR on the Windows
  # build, scan it with the phone camera.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  # Windows desktop is a thin shell around the PC web client (Ping Web): it
  # hosts an Edge WebView2 view pointed at web.example.invalid. Windows-only
  # plugin; unused on Android.
  webview_windows: ^0.4.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.1
  local_notifier: ^0.1.6
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Bundled so tray_manager can load the Windows tray icon at runtime
    # (resolved under data/flutter_assets/). Harmless on other platforms.
    - windows/runner/resources/app_icon.ico

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
