name: ping
description: "Ping – ein schneller, moderner Messenger."
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2
  # Media + accessibility
  file_picker: ^8.1.6
  record: ^5.2.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
