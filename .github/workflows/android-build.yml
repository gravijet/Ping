name: Android Build

# Builds universal and per-ABI APKs and uploads them to a prerelease.
# Configure the ANDROID_* repository secrets for stable release signing.
# Builds without those secrets use the debug keystore.

on:
  workflow_dispatch:

permissions:
  contents: write   # create the build release + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Derive version
        id: version
        run: |
          VER="$(grep -E '^version:' app/pubspec.yaml | head -1 | sed -E 's/version:\s*//; s/\+.*//')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Ping for Android v${VER}"

      - name: Configure release signing (if secrets present)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Release keystore provided — signing for OTA."
            echo "$KEYSTORE_B64" | base64 -d > app/android/ping-release.jks
            cat > app/android/key.properties <<EOF
          storeFile=ping-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building DEBUG-signed APKs (not an OTA update)."
          fi

      - name: Tune Gradle for the CI runner (avoid OOM / exit 143)
        # The committed app/android/gradle.properties asks for -Xmx8G + 4G
        # metaspace — right for a big dev box, but it OOM-kills assembleRelease on
        # a hosted runner (the JVM is SIGTERM'd → Gradle exit 143). Properties in
        # GRADLE_USER_HOME override the project file, so cap memory + drop the
        # daemon/parallelism here without touching the dev-tuned committed file.
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          kotlin.daemon.jvmargs=-Xmx1536m
          EOF

      - name: Install packages
        working-directory: app
        run: flutter pub get

      # ONE build produces the universal APK *and* the per-ABI splits, all on the
      # same base version code. We deliberately do NOT pass `--split-per-abi`:
      # that path stamps each split with an inflated version code (base+1000·abi),
      # which makes Android reject the universal as a downgrade on reinstall. The
      # splits come from AGP's native `splits { abi { … } }` block in build.gradle.kts
      # instead, which keeps every variant on the base version code.
      - name: Build universal + per-ABI APKs
        working-directory: app
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/ping-${{ steps.version.outputs.version }}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="app/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$f" ] && cp "$f" "dist/ping-${{ steps.version.outputs.version }}-${abi}.apk" || true
          done
          ls -la dist

      # The android and windows workflows are usually dispatched together and share
      # one `build-<version>` release, so create it only if it isn't there yet — and
      # tolerate losing that race to the other job.
      - name: Publish APKs to the build release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Ping $VERSION — CI build" \
              --prerelease \
              --notes "Android and Windows build artifacts for Ping $VERSION." \
            || true
          fi
          gh release upload "$TAG" dist/*.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
