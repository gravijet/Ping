name: Android Build

# Builds the Ping Android app: per-ABI split APKs (smaller, used by the in-app
# updater) plus a universal APK (the default download + fallback). Uploaded as
# workflow artifacts.
#
# Signing: to produce OTA-grade builds that install *over* an existing Ping
# install, the same stable release keystore must be used. Provide it as repo
# secrets and this workflow signs with it; without them it falls back to the
# debug keystore (fine for fresh installs / testing, but NOT a drop-in update —
# the signatures won't match). Required secrets for release signing:
#   ANDROID_KEYSTORE_BASE64  – base64 of app/android/ping-release.jks
#   ANDROID_KEY_ALIAS        – key alias
#   ANDROID_KEY_PASSWORD     – key password
#   ANDROID_STORE_PASSWORD   – keystore password
#
# After a signed run, download the artifact, then on the server publish with:
#   server/scripts/publish-apk.sh   (verifies each APK's version with aapt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Derive version
        id: version
        run: |
          VER="$(grep -E '^version:' app/pubspec.yaml | head -1 | sed -E 's/version:\s*//; s/\+.*//')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Ping for Android v${VER}"

      - name: Configure release signing (if secrets present)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Release keystore provided — signing for OTA."
            echo "$KEYSTORE_B64" | base64 -d > app/android/ping-release.jks
            cat > app/android/key.properties <<EOF
          storeFile=ping-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building DEBUG-signed APKs (not an OTA update)."
          fi

      - name: Install packages
        working-directory: app
        run: flutter pub get

      - name: Build per-ABI split APKs
        working-directory: app
        run: flutter build apk --split-per-abi --release

      - name: Build universal APK
        working-directory: app
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/ping-${{ steps.version.outputs.version }}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="app/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$f" ] && cp "$f" "dist/ping-${{ steps.version.outputs.version }}-${abi}.apk" || true
          done
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ping-Android-${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
