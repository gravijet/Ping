name: Windows Desktop Build

# Builds the Ping Windows desktop app and packages it as an installer.
# This Linux production host can't compile a Windows .exe (Flutter Windows needs
# Windows + Visual Studio), so this runs on a windows-latest runner.
#
# The installer is uploaded as a downloadable workflow artifact only — Ping
# hosts the .exe itself (drop it into server/public/downloads/ and the website's
# /download/windows serves it). No GitHub Release is created.
#
# Run it manually from the Actions tab (workflow_dispatch), download the
# "Ping-Windows-Setup" artifact, rename it to e.g. Ping-Setup-0.13.0.exe and copy
# it into the server's downloads folder.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Derive version
        id: version
        shell: bash
        run: |
          VER="$(grep -E '^version:' app/pubspec.yaml | head -1 | sed -E 's/version:\s*//; s/\+.*//')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Ping for Windows v${VER}"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows release
        working-directory: app
        # Newer MSVC toolchains (VS 2026 / MSVC 14.51 on windows-latest) turned
        # <experimental/coroutine> into a hard error (STL1011). Some plugins
        # (audioplayers_windows, webview_windows) still include it, so define the
        # documented escape macro for every cl.exe invocation via the CL env var.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Fetch WebView2 bootstrapper
        # Bundled into the installer so older machines without the Evergreen
        # WebView2 runtime get it installed automatically (see installer.iss).
        working-directory: app/windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"

      - name: Build installer (Inno Setup)
        working-directory: app/windows
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          # Download this from the run, rename to Ping-Setup-<version>.exe and
          # drop it into server/public/downloads/ on the server.
          name: Ping-Setup-${{ steps.version.outputs.version }}
          path: app/windows/dist/Ping-Windows-Setup.exe
          if-no-files-found: error
