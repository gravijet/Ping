name: Windows Desktop Build

# Builds the Ping Windows desktop app and packages it as an installer.
# This Linux production host can't compile a Windows .exe (Flutter Windows needs
# Windows + Visual Studio), so CI does it on a windows-latest runner.
#
# Triggers:
#   - pushing a tag like `v0.13.0`  -> builds + attaches the installer to a
#     GitHub Release of that tag (the website links the "latest release" asset).
#   - manual run (workflow_dispatch) -> builds + uploads the installer as a
#     workflow artifact you can download to test.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Derive version
        id: version
        shell: bash
        run: |
          # On a tag build use the tag (v0.13.0 -> 0.13.0); otherwise read the
          # version from pubspec.yaml (strip the +build suffix).
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -E '^version:' app/pubspec.yaml | head -1 | sed -E 's/version:\s*//; s/\+.*//')"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Ping for Windows v${VER}"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer (Inno Setup)
        working-directory: app/windows
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ping-Windows-Setup
          path: app/windows/dist/Ping-Windows-Setup.exe
          if-no-files-found: error

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Stable asset name -> the website can link:
          # https://github.com/<owner>/<repo>/releases/latest/download/Ping-Windows-Setup.exe
          files: app/windows/dist/Ping-Windows-Setup.exe
          fail_on_unmatched_files: true
