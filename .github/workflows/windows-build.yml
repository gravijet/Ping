name: Windows Desktop Build

# Builds the Ping Windows desktop app and packages it as an installer.
# This Linux production host can't compile a Windows .exe (Flutter Windows needs
# Windows + Visual Studio), so this runs on a windows-latest runner.
#
# Ping hosts the .exe itself (drop it into server/public/downloads/ and the
# website's /download/windows serves it) — this build only has to hand the file
# over. It does that via a prerelease tagged `build-<version>`, shared with the
# android-build workflow; the repo is private, so that release is private too:
#   gh release download build-<version> -p 'Ping-Setup-*.exe' -D /tmp/…
# The asset is already named Ping-Setup-<version>.exe, so it can be copied
# straight into server/public/downloads/.
#
# Why a release and not a workflow artifact: artifact storage is billed
# *account-wide*, and old builds piling up there took down every repo on the
# account with "Artifact storage quota has been hit". Release assets don't count
# against that quota.

on:
  workflow_dispatch:

permissions:
  contents: write   # create the build release + upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Derive version
        id: version
        shell: bash
        run: |
          VER="$(grep -E '^version:' app/pubspec.yaml | head -1 | sed -E 's/version:\s*//; s/\+.*//')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Ping for Windows v${VER}"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows release
        working-directory: app
        # Newer MSVC toolchains (VS 2026 / MSVC 14.51 on windows-latest) turned
        # <experimental/coroutine> into a hard error (STL1011). Some plugins
        # (audioplayers_windows, webview_windows) still include it, so define the
        # documented escape macro for every cl.exe invocation via the CL env var.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Fetch WebView2 bootstrapper
        # Bundled into the installer so older machines without the Evergreen
        # WebView2 runtime get it installed automatically (see installer.iss).
        working-directory: app/windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"

      - name: Build installer (Inno Setup)
        working-directory: app/windows
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      # The android and windows workflows are usually dispatched together and share
      # one `build-<version>` release, so create it only if it isn't there yet — and
      # tolerate losing that race to the other job.
      - name: Publish installer to the build release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Named for its destination right away — server/public/downloads/ wants
          # Ping-Setup-<version>.exe, so no renaming by hand afterwards.
          cp app/windows/dist/Ping-Windows-Setup.exe "Ping-Setup-${VERSION}.exe"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Ping $VERSION — CI build" \
              --prerelease \
              --notes "Build output, not a public release: the APKs go through server/scripts/publish-apk.sh and the installer into server/public/downloads/." \
            || true
          fi
          gh release upload "$TAG" "Ping-Setup-${VERSION}.exe" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
