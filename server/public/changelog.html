<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Changelog · Ping</title>
  <meta name="description" content="Jede neue Funktion, Verbesserung und Korrektur in Ping – transparent dokumentiert." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    .timeline{max-width:780px;margin:0 auto;position:relative;padding-left:30px}
    .timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--brand),var(--accent),transparent)}
    .entry{position:relative;margin-bottom:30px}
    .entry::before{content:"";position:absolute;left:-30px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--brand2);box-shadow:0 0 0 4px rgba(52,183,241,.15)}
    .entry .card{padding:22px 24px}
    .entry .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
    .entry .ver{font-size:21px;font-weight:800;letter-spacing:-.4px}
    .entry .date{color:var(--faint);font-size:13px;margin-left:auto}
    .entry h3{margin:8px 0 6px;font-size:18px;font-weight:700}
    .entry .content{color:#cfdcec;font-size:15px;line-height:1.7}
    .entry .content h3{font-size:16px;margin:16px 0 6px;color:var(--text)}
    .entry .content ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
    .entry .content p{margin:0 0 12px}
    .empty{text-align:center;color:var(--muted);padding:50px 0}
    .sk{height:120px;border-radius:22px;margin-bottom:24px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:36px}
    .filters button{cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--muted);font-weight:600;padding:8px 15px;border-radius:999px;font-size:13.5px;transition:.18s}
    .filters button.active,.filters button:hover{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--accent))}
  </style>
</head>
<body data-active="changelog">
  <div id="nav"></div>

  <main class="wrap">
    <div class="page-head reveal">
      <div class="eyebrow">Changelog</div>
      <h1>Was ist neu in Ping?</h1>
      <p>Wir verbessern Ping ständig. Hier siehst du jede Funktion, Verbesserung und Korrektur – transparent und nach Version sortiert.</p>
    </div>
    <div class="filters" id="filters">
      <button data-f="" class="active">Alles</button>
      <button data-f="feature">Neu</button>
      <button data-f="improvement">Verbessert</button>
      <button data-f="fix">Behoben</button>
      <button data-f="security">Sicherheit</button>
    </div>
    <div class="timeline" id="timeline">
      <div class="sk skeleton"></div><div class="sk skeleton"></div><div class="sk skeleton"></div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="/site.js"></script>
  <script>
    const P = window.Ping;
    const tl = document.getElementById('timeline');
    let all = [];
    let filter = '';

    function entryHtml(p){
      const tag = p.tag ? `<span class="pill ${P.esc(p.tag)}">${P.esc(P.tag(p.tag))}</span>` : '';
      const ver = p.version ? `<span class="ver">v${P.esc(p.version)}</span>` : `<span class="ver">${P.esc(p.title)}</span>`;
      const title = p.version ? `<h3>${P.esc(p.title)}</h3>` : '';
      return `<div class="entry reveal" data-tag="${P.esc(p.tag||'')}">
        <div class="card">
          <div class="top">${ver}${tag}<span class="date">${P.fmtDate(p.publishedAt||p.createdAt)}</span></div>
          ${title}
          ${p.summary?`<p class="muted" style="margin:0 0 10px">${P.esc(p.summary)}</p>`:''}
          <div class="content">${P.richText(p.body)}</div>
        </div>
      </div>`;
    }

    function render(){
      const list = filter ? all.filter(p=>p.tag===filter) : all;
      if(!list.length){ tl.innerHTML = `<div class="empty">Keine Einträge${filter?' in dieser Kategorie':' – bald gibt es hier Updates'}.</div>`; return; }
      tl.innerHTML = list.map(entryHtml).join('');
      P.reveal();
    }

    document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); filter=b.dataset.f; render();
    });

    P.json('/api/changelog').then(d=>{ all=d.posts||[]; render(); })
      .catch(()=>{ tl.innerHTML = `<div class="empty">Changelog gerade nicht erreichbar.</div>`; });
  </script>
</body>
</html>
