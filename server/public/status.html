<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System-Status · Ping</title>
  <meta name="description" content="Live-Status der Ping-Dienste: API, Echtzeit-Verbindung und mehr." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    .banner{max-width:820px;margin:0 auto 26px;border-radius:22px;padding:26px 28px;display:flex;align-items:center;gap:18px;
      background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(52,183,241,.10));border:1px solid rgba(34,197,94,.3)}
    .banner.down{background:linear-gradient(135deg,rgba(240,80,110,.18),rgba(245,158,11,.10));border-color:rgba(240,80,110,.35)}
    .banner .big{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:rgba(34,197,94,.2)}
    .banner.down .big{background:rgba(240,80,110,.2)}
    .banner h2{margin:0;font-size:23px;letter-spacing:-.4px}
    .banner p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
    .components{max-width:820px;margin:0 auto}
    .comp{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border:1px solid var(--line);border-radius:16px;background:var(--glass);margin-bottom:12px}
    .comp .l{display:flex;flex-direction:column;gap:2px}
    .comp .l b{font-size:15.5px}
    .comp .l span{color:var(--faint);font-size:13px}
    .comp .r{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
    .comp .r.ok{color:#86efac}.comp .r.down{color:#ffb3c0}
    .statgrid{max-width:820px;margin:30px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    @media(max-width:680px){.statgrid{grid-template-columns:1fr 1fr}}
    .sbox{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px}
    .sbox .n{font-size:28px;font-weight:800;letter-spacing:-1px}
    .sbox .k{color:var(--faint);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-top:3px;font-weight:600}
    .meta-row{max-width:820px;margin:18px auto 0;color:var(--faint);font-size:13px;text-align:center}
  </style>
</head>
<body data-active="status">
  <div id="nav"></div>

  <main class="wrap">
    <div class="page-head reveal">
      <div class="eyebrow">System-Status</div>
      <h1>Läuft alles?</h1>
      <p>Live-Überblick über die Ping-Dienste. Diese Seite aktualisiert sich automatisch.</p>
    </div>

    <div class="banner" id="banner">
      <div class="big" id="bannerIcon">✓</div>
      <div><h2 id="bannerTitle">Status wird geprüft …</h2><p id="bannerSub">Einen Moment.</p></div>
    </div>

    <div class="components" id="components"></div>

    <div class="statgrid" id="statgrid"></div>
    <div class="meta-row" id="metaRow"></div>
  </main>

  <div id="footer"></div>
  <script src="/site.js"></script>
  <script>
    const P = window.Ping;
    function fmtUptime(s){ if(!s) return '–'; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'d ':'')+(h?h+'h ':'')+m+'m'; }

    function compRow(name, desc, ok){
      return `<div class="comp">
        <div class="l"><b>${name}</b><span>${desc}</span></div>
        <div class="r ${ok?'ok':'down'}"><span class="status-dot ${ok?'ok':'down'}"></span>${ok?'Betriebsbereit':'Gestört'}</div>
      </div>`;
    }

    async function refresh(){
      let health=null, stats=null;
      try{ health = await P.json('/health'); }catch{}
      try{ stats = await P.json('/api/public/stats'); }catch{}
      const apiOk = !!(health && health.ok);
      const dataOk = !!stats;
      const allOk = apiOk && dataOk;

      const banner = document.getElementById('banner');
      banner.classList.toggle('down', !allOk);
      document.getElementById('bannerIcon').textContent = allOk ? '✓' : '!';
      document.getElementById('bannerTitle').textContent = allOk ? 'Alle Systeme betriebsbereit' : 'Eingeschränkter Betrieb';
      document.getElementById('bannerSub').textContent = allOk
        ? 'Ping läuft normal. Letzte Prüfung: ' + new Date().toLocaleTimeString('de-DE')
        : 'Wir konnten nicht alle Dienste erreichen. Letzte Prüfung: ' + new Date().toLocaleTimeString('de-DE');

      document.getElementById('components').innerHTML =
        compRow('API', 'Anmeldung, Chats &amp; Nachrichten', apiOk) +
        compRow('Echtzeit-Verbindung', 'Live-Nachrichten über WebSocket', apiOk) +
        compRow('Status &amp; Medien', 'Status-Updates und Datei-Uploads', apiOk) +
        compRow('Daten-API', 'Newsroom, Changelog &amp; Statistik', dataOk);

      if(stats){
        document.getElementById('statgrid').innerHTML =
          `<div class="sbox"><div class="n">${P.count(stats.online)}</div><div class="k">Gerade online</div></div>
           <div class="sbox"><div class="n">${P.count(stats.users)}</div><div class="k">Nutzer</div></div>
           <div class="sbox"><div class="n">${P.count(stats.messages)}</div><div class="k">Nachrichten</div></div>
           <div class="sbox"><div class="n">${P.count(stats.statuses)}</div><div class="k">Status aktiv</div></div>`;
        document.getElementById('metaRow').textContent =
          `Version ${stats.version} · Uptime ${fmtUptime(stats.uptimeSec)}`;
      }
    }
    refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
