<!DOCTYPE html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090e" />
    <title>Ping Web</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- App root. JS swaps between the auth screen and the messenger shell. -->
    <div id="app" class="app" aria-busy="true">
      <div class="boot">
        <div class="boot-logo">Ping</div>
        <div class="boot-spin" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Layered UI: toasts, modals, incoming-call overlay. -->
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="call-root"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
