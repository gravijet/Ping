# coturn configuration for Ping voice/video calls.
# Copy to /etc/turnserver.conf, fill in the secrets, then: systemctl enable --now coturn
# See coturn.md for the full walkthrough.

# Listen on the standard STUN/TURN port.
listening-port=3478
# (Optional) TLS for turns:; needs a cert (e.g. the same one nginx uses).
# tls-listening-port=5349

# This host's PUBLIC IP. coturn relays media through it.
listening-ip=0.0.0.0
external-ip=192.0.2.1

# The realm — use your domain.
realm=example.invalid
server-name=example.invalid

# Long-term credential mechanism with a single static user. The same username +
# password go into server/.env as TURN_USER / TURN_PASS so /api/ice can hand
# them to the app.
lt-cred-mech
user=pingturn:CHANGE_ME_TO_A_LONG_RANDOM_SECRET

# The UDP relay port range coturn allocates from — open these in the firewall.
min-port=49152
max-port=65535

# Hardening: don't relay to private/loopback ranges, no multicast, quieter logs.
no-multicast-peers
denied-peer-ip=192.0.2.1-192.0.2.1
denied-peer-ip=192.0.2.1-192.0.2.1
denied-peer-ip=192.0.2.1-192.0.2.1
no-cli
fingerprint
stale-nonce=600
